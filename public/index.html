<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: usa a tela inteira no iPhone (o app respeita as áreas seguras) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>In Tennis Club</title>
    <meta name="description" content="Reserve quadras, jogue com a galera e suba no ranking do In Tennis Club." />

    <!-- Webapp instalável (PWA): ícone na tela inicial e tela cheia -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16281F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="In Tennis" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #16281f;
        /* iPhone: não aumenta o texto sozinho ao girar a tela */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* sem zoom por toque duplo e sem atraso no toque */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* dvh acompanha a barra do navegador do celular (100vh deixava o rodapé cortado) */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      body {
        overflow: hidden;
        /* sem "puxar para recarregar" nem efeito elástico atrás do app */
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o In Tennis Club.</noscript>
    <div id="root"></div>
  </body>
</html>
